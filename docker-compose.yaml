services:
  fourbito-front:
    build:
      context: ./front/fourbito
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    ports:
      - "3000:3000"
    # En producción no montamos código local
    volumes:
      - fourbito-front-data:/app/node_modules
      - fourbito-front-nuxt:/app/.nuxt
    working_dir: /app
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    env_file:
      - .env
    restart: always
    networks:
      - fourbito-network

  fourbito-back:
    build:
      context: ./back/node
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - fourbito-back-data:/app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=production
      # Usar variables del archivo .env principal
      - DB_NAME=${NODE_DB_NAME}
      - DB_USER=${NODE_DB_USER}
      - DB_PASSWORD=${NODE_DB_PASSWORD}
      - DB_HOST=${NODE_DB_HOST}
    env_file:
      - .env
    restart: always
    networks:
      - fourbito-network
    links:
      - fourbito-mysql
    depends_on:
      - fourbito-mysql

  fourbito-mysql:
    image: mysql:5.7
    ports:
      # En producción, mejor no exponer directamente la base de datos
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - fourbito-mysql-data:/var/lib/mysql
    restart: always
    networks:
      - fourbito-network

  fourbito-back-odoo:
    build:
      context: ./back/odoo
      dockerfile: Dockerfile
    command: sh -c "cp .env.DEV .env && npm install && npm start"
    volumes:
      - fourbito-odoo-data:/usr/src/app/node_modules
    working_dir: /usr/src/app
    ports:
      - "4002:4002"
    restart: always
    networks:
      - fourbito-network

  fourbito-nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - fourbito-front
    networks:
      - fourbito-network

  fourbito-adminer:
    image: adminer
    ports:
      # En producción, limitar el acceso a localhost
      - "127.0.0.1:8080:8080"
    restart: always
    networks:
      - fourbito-network

  fourbito-odoo:
    image: odoo:17
    depends_on:
      - fourbito-odoo-db
    ports:
      - "8069:8069"
    environment:
      - HOST=fourbito-odoo-db
      - USER=${ODOO_USER}
      - PASSWORD=${ODOO_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./back/odoo/odoo_files/config:/etc/odoo
      - ./back/odoo/odoo_files/config/odoo.conf:/etc/odoo/odoo.conf
    restart: always
    networks:
      - fourbito-network
    command: [ "/bin/sh", "-c", "sleep 10 && odoo -d odoo -i sale,invoicing,stock --without-demo=all --stop-after-init && odoo -d odoo" ]

  fourbito-odoo-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      POSTGRES_DB: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - fourbito-network

  fourbito-pgadmin:
    image: dpage/pgadmin4
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - fourbito-odoo-db
    volumes:
      - pgadmin-data:/var/lib/pgadmin4
    restart: always
    networks:
      - fourbito-network

volumes:
  fourbito-mysql-data:
  fourbito-front-data:
  fourbito-front-nuxt:
  fourbito-back-data:
  fourbito-odoo-data:
  odoo-db-data:
  odoo-data:
  pgadmin-data:


networks:
  fourbito-network:
    driver: bridge
