services:
  fourbito-front:
    build:
      context: ./front/fourbito
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./front/fourbito:/app
      - /app/node_modules
      - /app/.nuxt
    working_dir: /app
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - fourbito-network

  fourbito-back:
    build:
      context: ./back/node
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ./back/node:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - fourbito-network
    links:
      - fourbito-mysql
    depends_on:
      - fourbito-mysql

  fourbito-mysql:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=fourbito
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - fourbito-mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - fourbito-network

  fourbito-back-odoo:
    build:
      context: ./back/odoo
      dockerfile: Dockerfile
    command: sh -c "cp .env.DEV .env && npm install && npm run dev"
    volumes:
      - ./back/odoo:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - "4002:4002"

  fourbito-adminer:
    image: adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - fourbito-network

  # fourbito-mongodb:
  #   image: mongo
  #   container_name: fourbito-mongodb
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - fourbito-mongo-data:/data/db
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=root
  #     - MONGO_INITDB_ROOT_PASSWORD=root
  #   restart: unless-stopped
  #   networks:
  #     - fourbito-network

  # fourbito-mongo-express:
  #   image: mongo-express
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - ME_CONFIG_MONGODB_ADMINUSERNAME=root
  #     - ME_CONFIG_MONGODB_ADMINPASSWORD=root
  #     - ME_CONFIG_MONGODB_URL=mongodb://root:root@fourbito-mongodb:27017/
  #     - ME_CONFIG_BASICAUTH=false
  #   restart: unless-stopped
  #   networks:
  #     - fourbito-network

  fourbito-odoo:
    image: odoo:17
    depends_on:
      - fourbito-odoo-db
    ports:
      - "8069:8069"
    environment:
      - HOST=fourbito-odoo-db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./back/odoo/odoo_files/config:/etc/odoo
      - ./back/odoo/odoo_files/config/odoo.conf:/etc/odoo/odoo.conf
    command: >
      sh -c " /entrypoint.sh; sleep 10; odoo -d odoo -i sale,invoicing,stock --without-demo=all --stop-after-init; if [ $? -eq 0 ]; then
        echo 'Modules installed successfully. Starting Odoo server...';
        odoo -d odoo;
      else
        echo 'Module installation failed. Check logs for details.';
      fi "

  fourbito-odoo-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  fourbito-pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - fourbito-odoo-db
    volumes:
      - pgadmin-data:/var/lib/pgadmin4

volumes:
  fourbito-mysql-data: # fourbito-mongo-data:

  odoo-db-data:
  odoo-data:
  pgadmin-data:


networks:
  fourbito-network:
    driver: bridge
